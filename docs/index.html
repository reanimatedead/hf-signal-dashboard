  }
  function unitTn(unit){
    if (!unit) return T("mf.unit_tn");
    if (unit === "USD_TN" || unit === "EUR_TN" || unit === "JPY_TN") return T("mf.unit_"+unit.slice(0,3).toLowerCase());
    return unit;
  }

  function renderRegion(r, block){
    if (!block) return;
    // freshness badge
    const fb = document.getElementById('mf-fresh-'+r);
    if (fb){
      fb.className = 'mf-badge ' + (block.freshness_badge||'stale');
      fb.textContent = I18.code('freshness_badge', block.freshness_badge||'stale');
    }
    // counter
    const c = document.getElementById('mf-counter-'+r);
    const debt = block.debt || {};
    if (c){
      const val = debt.value_local_tn;
      const lblUnit = unitTn(debt.unit);
      let html = '<div class="mf-counter-lbl">'+tr('debt')+' ('+lblUnit+')</div>';
      html += '<div class="mf-counter-val">'+(val!=null?fmtNum(val,3):'—')+'</div>';
      if (r==='us' && debt.change_prev_day !== null && debt.change_prev_day !== undefined){
        const d = debt.change_prev_day;
        const cls = d >= 0 ? 'up' : 'dn';
        const sign = d >= 0 ? '+' : '';
        html += '<div class="mf-counter-delta '+cls+'">Δ '+sign+fmtNum(d,4)+' '+lblUnit+'</div>';
      } else {
        const lag = debt.lag_days;
        html += '<div class="mf-counter-delta">'+(debt.as_of?I18.fmtDate(debt.as_of,'ymd'):'—')+
                ' ('+(lag!=null?lag+tr('days'):'—')+')</div>';
      }
      c.innerHTML = html;
    }
    // real-value line: cb_assets.wow_change actual (T unit), directly above canvas
    const rv = document.getElementById('mf-real-'+r);
    if (rv){
      const cb0 = block.cb_assets || {};
      const wow0 = cb0.wow_change;
      const unit = unitTn(cb0.unit);
      if (wow0 === null || wow0 === undefined || Number.isNaN(+wow0)){
        rv.style.display = 'none';
        rv.innerHTML = '';
      } else {
        rv.style.display = '';
        const pos = wow0 >= 0;
        const cls = pos ? 'pos' : 'neg';
        const sign = pos ? '+' : '';
        const arrowLabel = pos ? tr('supply') : tr('absorb');
        rv.innerHTML = '<b>'+arrowLabel+'</b><span class="v '+cls+'">'+sign+fmtNum(wow0,3)+' '+unit+'</span>'+
                        '<span style="color:var(--text-faint)">('+tr('real_actual')+')</span>';
      }
    }
    // sink weekly-change grid (2x2): stocks/gold/crypto/cash wow_pct
    const sk = document.getElementById('mf-sinks-'+r);
    if (sk){
      const sm = block.sink_metrics;
      if (!sm){
        sk.innerHTML = '';
        sk.style.display = 'none';
      } else {
        sk.style.display = '';
        const order = ['stocks','gold','crypto','cash'];
        sk.title = tr('sink_note');
        const grid = order.map(key=>{
          const s = sm[key];
          if (!s) return '';
          const v = s.wow_pct;
          let valHtml;
          if (v === null || v === undefined || Number.isNaN(+v)){
            valHtml = '<span class="val na">—</span>';
          } else {
            const cls = v > 0 ? 'pos' : (v < 0 ? 'neg' : 'na');
            const sign = v > 0 ? '+' : '';
            valHtml = '<span class="val '+cls+'">'+sign+fmtNum(v,2)+'%</span>';
          }
          const sym = s.symbol ? '<span class="sym">'+s.symbol+'</span>' : '';
          return '<div class="mf-sink" title="'+tr('sink_weekly')+' — '+tr('sink_note')+'">'+
                 '<span class="lbl">'+trSink(key)+sym+'</span>'+valHtml+'</div>';
        }).join('');
        sk.innerHTML = '<div class="mf-sink-hd" style="grid-column:1/-1;font-size:9.5px;color:var(--text-dim);'+
                        'letter-spacing:0.04em;text-transform:uppercase">'+tr('sink_weekly')+'</div>'+grid+
                        '<div class="mf-sink-note" style="grid-column:1/-1" title="'+tr('sink_note')+'">'+tr('sink_note')+'</div>';
      }
    }
    // meta line (CB assets + source)
    const m = document.getElementById('mf-meta-'+r);
    if (m){
      const cb = block.cb_assets || {};
      const nl = block.net_liquidity;
      const parts = [];
      parts.push('<span><b>'+tr('cb_assets')+':</b> '+(cb.value_usd_tn!=null?fmtNum(cb.value_usd_tn,3):'—')+' '+unitTn(cb.unit)+'</span>');
      parts.push('<span><b>'+tr('as_of')+':</b> '+(cb.as_of?I18.fmtDate(cb.as_of,'ymd'):'—')+' ('+(cb.lag_days!=null?cb.lag_days+tr('days'):'—')+')</span>');
      parts.push('<span><b>'+tr('source')+':</b> '+(cb.source?I18.code('source',cb.source):'—')+'</span>');
      parts.push('<span class="mf-status">'+(cb.data_status?I18.code('data_status',cb.data_status):'—')+'</span>');
      if (r==='us' && nl){
        parts.push('<span><b>'+tr('net_liq')+':</b> '+(nl.value_usd_tn!=null?fmtNum(nl.value_usd_tn,3):'—')+' '+unitTn('USD_TN')+'</span>');
      }
      m.innerHTML = parts.join(' ');
    }
    // canvas
    const cv = document.getElementById('mf-cv-'+r);
    if (cv && window.HFParticles){
      const cb = block.cb_assets || {};
      const wow = +cb.wow_change || 0;
      // Normalize: a US WALCL move of 0.05T week-over-week is sizeable; scale mag accordingly.
      const mag = Math.min(1, Math.max(0.25, Math.abs(wow) * 4 + 0.3));
      const expand = wow >= 0;
      const sinks = SINKS.map(s => Object.assign({}, s, { label: trSink(s.key) }));
      if (mfEngines[r]){
        mfEngines[r].setDynamics({mag, expand});
      } else {
        mfEngines[r] = window.HFParticles.createFlowField(cv, {
          source: { rx: 0.5, ry: 0.18 },
          sinks: sinks,
          cbLabel: tr('cb_short'),
          expandLabel: tr('supply'),
          contractLabel: tr('absorb'),
          dynamics: { mag, expand, riskOff: 0 },
        });
      }
    }
  }

  // ── Correlation panel (mf-pane bottom, additive) ---------------
  let corrWindow = "60d"; // "60d" | "20d"
  function corrColor(rVal){
    // r>0 blue gradient, r<0 red gradient, |r|<0.3 grey (noise zone)
    if (rVal === null || rVal === undefined || Number.isNaN(rVal)) return {bg:'transparent', fg:'var(--text-faint)'};
    const a = Math.min(1, Math.abs(rVal));
    if (Math.abs(rVal) < 0.3){
      return {bg:'rgba(90,106,126,'+(0.10+0.10*a).toFixed(2)+')', fg:'var(--text-dim)'};
    }
    if (rVal > 0){
      return {bg:'rgba(59,130,246,'+(0.15+0.55*a).toFixed(2)+')', fg:'#eaf2ff'};
    }
    return {bg:'rgba(255,69,96,'+(0.15+0.55*a).toFixed(2)+')', fg:'#ffeef1'};
  }
  function corrSparkSVG(series, latestR){
    const W=260,H=60,L=4,R=4,T=6,B=6;
    const vals = (series||[]).map(p=>p && typeof p.r==='number' ? p.r : null);
    const n = vals.length;
    const X = i => L+(n<=1?0:i/(n-1)*(W-L-R));
    // fixed y-domain [-1,1]
    const Y = v => T+(1-((v+1)/2))*(H-T-B);
    const band30Top = Y(0.3), band30Bot = Y(-0.3);
    const pts = vals.map((v,i)=> v==null?null:`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean).join(' ');
    const zero = Y(0);
    let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${tr('corr_aria_spark')}">`;
    svg += `<rect x="${L}" y="${band30Top.toFixed(1)}" width="${W-L-R}" height="${(band30Bot-band30Top).toFixed(1)}" style="fill:var(--text-faint);opacity:0.14"/>`;
    svg += `<line x1="${L}" y1="${zero.toFixed(1)}" x2="${W-R}" y2="${zero.toFixed(1)}" style="stroke:var(--border2);stroke-width:0.6"/>`;
    if (pts){
      const cls = (latestR!=null && latestR<0) ? 'var(--red)' : 'var(--accent)';
      svg += `<polyline points="${pts}" style="fill:none;stroke:${cls};stroke-width:1.4"/>`;
    }
    svg += `</svg>`;
    return svg;
  }

  // ── Correlation network (fixed ring layout, canvas 2d, additive) --
  // Deterministic angles (degrees, 0°=+x/right, clockwise, canvas coords).
  // Left arc (140°..220°): N225, JGB5Y, JGB10Y, JGB30Y
  // Right arc (-40°..40°, i.e. 320°..40°): SPX, US5Y, US10Y, US30Y
  // Bottom arc (100°..80°, centered at 90°/down): USDJPY, US-JP10Yspread
  const CORR_NET_ANGLES = {
    N225: 220, JGB5Y: 193, JGB10Y: 167, JGB30Y: 140,
    SPX: -40, US5Y: -13, US10Y: 13, US30Y: 40,
    'USDJPY': 100, 'US-JP10Yspread': 80,
  };
  let corrNetHover = null; // {type:'edge', i, j, r} | null
  let corrNetPinned = null; // a4-UX #3: {type:'edge', i, j, r} | null — persists across redraws until cleared by a tap on empty space
  let corrNetResizeTimer = null;
  let corrNetLastGeom = null; // cached for hit-testing on mousemove without full recompute

  function corrNetLabel(lb){
    return I18.has("corr.node."+lb) ? T("corr.node."+lb) : lb;
  }

  function corrNetLayout(labels, w, h){
    // Ellipse centered in canvas; radii leave margin for labels.
    const cx = w/2, cy = h/2 + 6;
    const rx = Math.max(60, w/2 - 74);
    const ry = Math.max(60, h/2 - 46);
    return labels.map(lb => {
      const deg = CORR_NET_ANGLES.hasOwnProperty(lb) ? CORR_NET_ANGLES[lb] : 0;
      const rad = deg * Math.PI / 180;
      return {
        label: lb,
        x: cx + rx * Math.cos(rad),
        y: cy + ry * Math.sin(rad),
      };
    });
  }

  // Dual-encoding (a4-UX #1): color is redundant with line style (solid/dashed),
  // never relies on color alone. Blue/orange only — green/red avoided for
  // color-vision-deficiency accessibility (see CSS vars --blue/--orange).
  function corrNetColor(rVal, alpha){
    return rVal >= 0
      ? 'rgba(59,130,246,'+alpha.toFixed(2)+')'  // var(--blue) #3b82f6 — positive
      : 'rgba(255,140,48,'+alpha.toFixed(2)+')'; // var(--orange) #ff8c30 — negative
  }

  // a4-UX #2: opacity ramp (no hard cliff). |r|<0.25 not drawn (caller filters).
  // 0.25<=|r|<0.35 ramps alpha 0->1 linearly; |r|>=0.35 fully opaque (alpha=1).
  function corrNetAlpha(absR){
    if (absR >= 0.35) return 1;
    return Math.max(0, Math.min(1, (absR - 0.25) / 0.10));
  }

  function drawCorrNetwork(matrix, labels, nObs){
    const wrap = document.querySelector('.cp-net-wrap');
    const cv = document.getElementById('corr-network');
    const tip = document.getElementById('corr-net-tip');
    if (!cv || !wrap) { window.__corrNetworkStats = {window: corrWindow, edges: 0, nulls: 0}; return; }

    const rectW = wrap.clientWidth || 300;
    const rectH = wrap.clientHeight || 340;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(rectW * dpr);
    cv.height = Math.round(rectH * dpr);
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, rectW, rectH);

    const n = labels.length;
    const nodes = corrNetLayout(labels, rectW, rectH);

    // build edge list: upper-triangle only, |r|>=0.25 (a4-UX #2 threshold), non-null
    const edges = [];
    let nulls = 0;
    for (let i = 0; i < n; i++){
      for (let j = i+1; j < n; j++){
        const rVal = matrix[i] ? matrix[i][j] : null;
        if (rVal === null || rVal === undefined || Number.isNaN(rVal)){
          nulls++;
          continue;
        }
        if (Math.abs(rVal) >= 0.25){
          edges.push({ i, j, r: rVal });
        }
      }
    }

    // a4-UX #4: quadratic-bezier control point per edge, bulging outward
    // (away from the ring center) so edges don't bundle through the middle.
    const cx0 = rectW/2, cy0 = rectH/2 + 6;
    edges.forEach(e => {
      const a = nodes[e.i], b = nodes[e.j];
      const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
      let ox = mx - cx0, oy = my - cy0;
      const od = Math.sqrt(ox*ox + oy*oy) || 1;
      ox /= od; oy /= od;
      const chord = Math.sqrt((b.x-a.x)*(b.x-a.x) + (b.y-a.y)*(b.y-a.y));
      const bulge = chord * 0.2; // 0.15-0.25 range per spec
      e.cpx = mx + ox * bulge;
      e.cpy = my + oy * bulge;
    });

    // cache geometry for hit-testing (hover/click) independent of redraw
    corrNetLastGeom = { nodes, edges, rectW, rectH };

    const totalPairs = n*(n-1)/2;
    if (nulls === totalPairs){
      // every off-diagonal pair is null → "insufficient data" (do not fabricate)
      // canvas fillStyle does not resolve CSS vars; resolve manually
      const dimColor = getComputedStyle(document.documentElement).getPropertyValue('--text-dim').trim() || '#8a97a8';
      ctx.fillStyle = dimColor;
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(tr('corr_net_empty'), rectW/2, rectH/2);
      window.__corrNetworkStats = {window: corrWindow, edges: 0, nulls: nulls};
      return;
    }

    // draw edges first (under nodes)
    // a4-UX #1 (dual-encoding): positive=solid, negative=dashed, in addition
    // to the blue/positive vs orange/negative color split (corrNetColor).
    // a4-UX #2 (opacity ramp): corrNetAlpha() replaces the old hard cutoff.
    // a4-UX #4 (bezier): quadraticCurveTo via each edge's cached cpx/cpy.
    edges.forEach(e => {
      const a = nodes[e.i], b = nodes[e.j];
      const absR = Math.min(1, Math.abs(e.r));
      const isHover = (corrNetHover && corrNetHover.type === 'edge' &&
                       corrNetHover.i === e.i && corrNetHover.j === e.j) ||
                       (corrNetPinned && corrNetPinned.type === 'edge' &&
                       corrNetPinned.i === e.i && corrNetPinned.j === e.j);
      const width = 1 + absR * 4; // 1px..5px
      const rampAlpha = corrNetAlpha(absR);
      const alpha = isHover ? Math.max(0.95, rampAlpha) : rampAlpha;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.quadraticCurveTo(e.cpx, e.cpy, b.x, b.y);
      ctx.strokeStyle = corrNetColor(e.r, alpha);
      ctx.lineWidth = isHover ? width + 1.2 : width;
      ctx.lineCap = 'round';
      if (e.r < 0){
        ctx.setLineDash([5, 4]);
      } else {
        ctx.setLineDash([]);
      }
      ctx.stroke();
      ctx.setLineDash([]); // reset so node strokes / other edges are unaffected
    });

    // draw nodes
    const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#00ffcc';
    const bg2Color = getComputedStyle(document.documentElement).getPropertyValue('--bg2').trim() || '#0a0e14';
    const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#e8edf3';
    const border2Color = getComputedStyle(document.documentElement).getPropertyValue('--border2').trim() || '#33404f';
    nodes.forEach((node, idx) => {
      const isHoverNode = (corrNetHover && corrNetHover.type === 'edge' &&
                           (corrNetHover.i === idx || corrNetHover.j === idx)) ||
                           (corrNetPinned && corrNetPinned.type === 'edge' &&
                           (corrNetPinned.i === idx || corrNetPinned.j === idx));
      ctx.beginPath();
      ctx.arc(node.x, node.y, isHoverNode ? 5.5 : 4.5, 0, Math.PI*2);
      ctx.fillStyle = isHoverNode ? accentColor : bg2Color;
      ctx.fill();
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = isHoverNode ? accentColor : border2Color;
      ctx.stroke();

      // label placement: offset outward from center along the same angle
      const cx = rectW/2, cy = rectH/2 + 6;
      const dx = node.x - cx, dy = node.y - cy;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      const lx = node.x + (dx/dist) * 13;
      const ly = node.y + (dy/dist) * 13;
      ctx.font = (isHoverNode ? '700 ' : '600 ') + '10px "Roboto Condensed",sans-serif';
      ctx.fillStyle = isHoverNode ? accentColor : textColor;
      ctx.textAlign = dx > 8 ? 'left' : (dx < -8 ? 'right' : 'center');
      ctx.textBaseline = dy > 8 ? 'top' : (dy < -8 ? 'bottom' : 'middle');
      ctx.fillText(corrNetLabel(node.label), lx, ly);
    });

    window.__corrNetworkStats = {window: corrWindow, edges: edges.length, nulls: nulls};

    // legend (a4-UX #1) — small HTML overlay inside .cp-net-wrap, rebuilt
    // alongside the canvas since renderCorrPanel() replaces innerHTML wholesale.
    if (!wrap.querySelector('.cp-net-legend')){
      const legend = document.createElement('div');
      legend.className = 'cp-net-legend';
      legend.innerHTML =
        '<span><i class="pos"></i>'+tr('corr_net_legend_pos')+'</span>'+
        '<span><i class="neg"></i>'+tr('corr_net_legend_neg')+'</span>';
      wrap.appendChild(legend);
    }

    // event wiring (bind once per redraw is fine — canvas element is replaced by innerHTML each render)
    if (!cv.__corrNetBound){
      cv.__corrNetBound = true;
      cv.addEventListener('mousemove', function(ev){
        corrNetHandleHover(ev, cv, tip);
      });
      cv.addEventListener('mouseleave', function(){
        corrNetHover = null;
        if (!corrNetPinned && tip) tip.style.display = 'none';
        corrNetRedrawCurrent();
      });
      // a4-UX #3: tap/click to pin a tooltip; tap empty space to unpin.
      // pointerdown covers touch + mouse reliably across mobile widths.
      cv.addEventListener('pointerdown', function(ev){
        corrNetHandleTap(ev, cv, tip);
      });
    }
  }

  function corrNetRedrawCurrent(){
    const D = window.DATA;
    const corr = D && D.correlations;
    if (!corr) return;
    const matrix = corrWindow === '60d' ? corr.matrix_60d : corr.matrix_20d;
    const labels = corr.labels || [];
    if (matrix && labels.length) drawCorrNetwork(matrix, labels, corr.n_obs);
  }

  // Finds the nearest edge (bezier-aware) to a canvas-local point, or null.
  function corrNetPickEdge(mx, my){
    if (!corrNetLastGeom) return null;
    const { nodes, edges } = corrNetLastGeom;
    const HIT = 8;
    let best = null, bestDist = HIT;
    edges.forEach(e => {
      const a = nodes[e.i], b = nodes[e.j];
      const d = ptQuadDist(mx, my, a.x, a.y, e.cpx, e.cpy, b.x, b.y);
      if (d < bestDist){ bestDist = d; best = e; }
    });
    return best;
  }

  function corrNetShowTip(tip, mx, my, best, rectW, rectH){
    if (!tip || !corrNetLastGeom) return;
    const { nodes } = corrNetLastGeom;
    const la = corrNetLabel(nodes[best.i].label);
    const lb = corrNetLabel(nodes[best.j].label);
    tip.textContent = la+' × '+lb+': r='+best.r.toFixed(2);
    tip.style.display = 'block';
    // keep tooltip inside the wrap bounds (rough estimate; tip is small)
    const tw = tip.offsetWidth || 120, th = tip.offsetHeight || 20;
    let left = mx + 10, top = my + 10;
    if (rectW && left + tw > rectW) left = mx - tw - 10;
    if (rectH && top + th > rectH) top = my - th - 10;
    if (left < 0) left = 2;
    if (top < 0) top = 2;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }

  function corrNetHandleHover(ev, cv, tip){
    if (!corrNetLastGeom) return;
    const rect = cv.getBoundingClientRect();
    const mx = ev.clientX - rect.left;
    const my = ev.clientY - rect.top;
    const best = corrNetPickEdge(mx, my);
    const prev = corrNetHover;
    corrNetHover = best ? { type:'edge', i: best.i, j: best.j, r: best.r } : null;
    // pinned tooltip takes priority over hover tooltip; hover only shown when unpinned
    if (!corrNetPinned){
      if (best) corrNetShowTip(tip, mx, my, best, corrNetLastGeom.rectW, corrNetLastGeom.rectH);
      else if (tip) tip.style.display = 'none';
    }
    const changed = !prev || !best || prev.i !== best.i || prev.j !== best.j;
    if (changed) corrNetRedrawCurrent();
  }

  // a4-UX #3: click/tap on an edge pins its tooltip; click/tap on empty
  // canvas space clears the pin. Pin state survives redraw (window toggle,
  // resize) since corrNetPinned is module-level state, not recomputed geometry.
  function corrNetHandleTap(ev, cv, tip){
    if (!corrNetLastGeom) return;
    const rect = cv.getBoundingClientRect();
    const clientX = ev.clientX != null ? ev.clientX : (ev.touches && ev.touches[0] && ev.touches[0].clientX);
    const clientY = ev.clientY != null ? ev.clientY : (ev.touches && ev.touches[0] && ev.touches[0].clientY);
    if (clientX == null || clientY == null) return;
    const mx = clientX - rect.left;
    const my = clientY - rect.top;
    const best = corrNetPickEdge(mx, my);
    if (best){
      corrNetPinned = { type:'edge', i: best.i, j: best.j, r: best.r };
      corrNetShowTip(tip, mx, my, best, corrNetLastGeom.rectW, corrNetLastGeom.rectH);
    } else {
      corrNetPinned = null;
      if (tip) tip.style.display = 'none';
    }
    corrNetRedrawCurrent();
  }

  function ptSegDist(px, py, x1, y1, x2, y2){
    const dx = x2-x1, dy = y2-y1;
    const lenSq = dx*dx + dy*dy;
    let t = lenSq === 0 ? 0 : ((px-x1)*dx + (py-y1)*dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t*dx, cy = y1 + t*dy;
    return Math.sqrt((px-cx)*(px-cx) + (py-cy)*(py-cy));
  }

  // a4-UX #4 hit-testing: edges are now quadratic beziers, not straight
  // lines. Exact point-to-bezier distance has no closed form, so we sample
  // the curve at a fixed resolution and take the nearest sampled point —
  // sufficient precision for an 8px hit radius on a ~300x340 canvas.
  function ptQuadDist(px, py, x0, y0, cx, cy, x1, y1){
    const STEPS = 16;
    let best = Infinity;
    let prevX = x0, prevY = y0;
    for (let s = 1; s <= STEPS; s++){
      const t = s / STEPS;
      const mt = 1 - t;
      const bx = mt*mt*x0 + 2*mt*t*cx + t*t*x1;
      const by = mt*mt*y0 + 2*mt*t*cy + t*t*y1;
      const d = ptSegDist(px, py, prevX, prevY, bx, by);
      if (d < best) best = d;
      prevX = bx; prevY = by;
    }
    return best;
  }

  window.addEventListener('resize', function(){
    if (corrNetResizeTimer) clearTimeout(corrNetResizeTimer);
    corrNetResizeTimer = setTimeout(function(){
      corrNetRedrawCurrent();
    }, 150);
  });

  function renderCorrPanel(){
    const panel = document.getElementById('corr-panel');
    if (!panel) return;
    const D = window.DATA;
    const corr = D && D.correlations;
    if (!corr){
      panel.innerHTML =
        '<div class="cp-head"><span class="cp-title">'+tr('corr_title')+'</span></div>'+
        '<div class="cp-empty">'+tr('corr_missing')+'</div>';
      return;
    }
    const status = corr.data_status || 'placeholder';
    if (status === 'placeholder'){
      panel.innerHTML =
        '<div class="cp-head"><span class="cp-title">'+tr('corr_title')+'</span>'+
        '<span class="mf-badge stale">'+I18.code('data_status',status)+'</span></div>'+
        '<div class="cp-empty">'+tr('corr_missing')+'</div>';
      return;
    }
    const labels = corr.labels || [];
    const nObs = corr.n_obs;
    const matrix = corrWindow === '60d' ? corr.matrix_60d : corr.matrix_20d;
    const badgeCls = status === 'live' ? 'daily' : (status === 'stale' ? 'stale' : 'stale');
    const lag = corr.lag_days;

    let html = '';
    html += '<div class="cp-head">';
    html += '<span class="cp-title">'+tr('corr_title')+'</span>';
    html += '<span class="mf-badge '+badgeCls+'">'+I18.code('data_status',status)+'</span>';
    html += '<span class="cp-asof">'+tr('corr_asof')+' '+(corr.as_of ? I18.fmtDate(String(corr.as_of).slice(0,10),'ymd') : '—')+
            ' ('+tr('corr_lag')+' '+(lag!=null?lag+tr('days'):'—')+')</span>';
    const srcs = Array.isArray(corr.sources) ? corr.sources.filter(Boolean) : [];
    if (srcs.length){
      html += '<span class="cp-asof"><b>'+tr('source')+':</b> '+srcs.map(s=>I18.code('source',s)).join(' · ')+'</span>';
    }
    html += '</div>';
    if (corr.method){
      html += '<div class="cp-method">'+tr('corr_method_label')+': '+I18.code('corr_method',corr.method)+'</div>';
    }

    // window toggle
    html += '<div class="cp-toolbar">';
    html += '<button type="button" class="cp-wbtn'+(corrWindow==='60d'?' active':'')+'" onclick="window.__corrSetWindow(\'60d\')">'+tr('corr_w60')+'</button>';
    html += '<button type="button" class="cp-wbtn'+(corrWindow==='20d'?' active':'')+'" onclick="window.__corrSetWindow(\'20d\')">'+tr('corr_w20')+'</button>';
    html += '</div>';

    // correlation network (fixed ring layout, canvas 2d)
    if (matrix && labels.length){
      html += '<div class="cp-net-wrap"><canvas id="corr-network"></canvas><div class="cp-net-tip" id="corr-net-tip"></div></div>';
    }

    // heatmap (DOM table — consistent with existing .tbl-wrap table pattern; native title tooltip)
    if (matrix && labels.length){
      html += '<div class="cp-heat-wrap"><table class="cp-heat"><thead><tr><th class="cp-rowlabel">&nbsp;</th>';
      labels.forEach(lb => { html += '<th>'+lb+'</th>'; });
      html += '</tr></thead><tbody>';
      labels.forEach((rowLb, i) => {
        html += '<tr><td class="cp-rowlabel">'+rowLb+'</td>';
        labels.forEach((colLb, j) => {
          const rVal = matrix[i] ? matrix[i][j] : null;
          if (i === j){
            html += '<td class="cp-cell cp-diag" title="'+rowLb+' × '+colLb+'">1.00</td>';
          } else if (rVal === null || rVal === undefined){
            html += '<td class="cp-cell" style="color:var(--text-faint)" title="'+rowLb+' × '+colLb+': —">—</td>';
          } else {
            const col = corrColor(rVal);
            const title = rowLb+' × '+colLb+': r='+rVal.toFixed(2)+' (n='+(nObs!=null?nObs:'—')+')';
            html += '<td class="cp-cell" style="background:'+col.bg+';color:'+col.fg+'" title="'+title+'">'+rVal.toFixed(2)+'</td>';
          }
        });
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }

    // key_pairs sparklines
    const kp = corr.key_pairs || [];
    const longWin = (corr.window && corr.window.long) != null ? corr.window.long : 60;
    if (kp.length){
      html += '<div class="cp-spark-grid">';
      kp.forEach(pair => {
        const pl = pair.pair || [];
        const series = pair.series_60d || [];
        const last = series.length ? series[series.length-1] : null;
        const latestR = last && typeof last.r === 'number' ? last.r : null;
        const rCls = latestR==null ? '' : (latestR>=0?'pos':'neg');
        const rTxt = latestR==null ? '—' : latestR.toFixed(2);
        html += '<div class="cp-spark">';
        html += '<div class="cp-spark-hd"><span>'+pl.join(' × ')+' ('+longWin+tr('corr_rolling')+')</span>'+
                '<span class="cp-spark-r '+rCls+'">r='+rTxt+'</span></div>';
        html += corrSparkSVG(series, latestR);
        html += '</div>';
      });
      html += '</div>';
    }

    // footnotes
    html += '<div class="cp-foot">';
    html += '<div>'+tr('corr_net_foot')+'</div>';
    html += '<div>'+tr('corr_foot1')+'</div>';
    html += '<div class="cp-disc">'+tr('corr_foot2')+'</div>';
    html += '</div>';

    panel.innerHTML = html;

    if (matrix && labels.length){
      drawCorrNetwork(matrix, labels, nObs);
    } else {
      window.__corrNetworkStats = {window: corrWindow, edges: 0, nulls: 0};
    }
  }
  window.__corrSetWindow = function(w){
    corrWindow = w;
    renderCorrPanel();
  };

  function refreshMoneyFlow(){
    const D = window.DATA;
    const mf = D && D.money_flow;
    if (mf) ["us","eu","jp"].forEach(r => renderRegion(r, mf[r]));
    renderCorrPanel();
  }
  window.__mfRefresh = refreshMoneyFlow;
  window.__mfShow = function(){
    refreshMoneyFlow();
    document.getElementById('mf-pane').style.display = 'block';
    const tw = document.querySelector('.tbl-wrap'); if (tw) tw.style.display = 'none';
    const tb = document.getElementById('toolbar'); if (tb) tb.style.display = 'none';
  };
  window.__mfHide = function(){
    document.getElementById('mf-pane').style.display = 'none';
    const tw = document.querySelector('.tbl-wrap'); if (tw) tw.style.display = '';
    const tb = document.getElementById('toolbar'); if (tb) tb.style.display = '';
  };

  // ── Boot hook: integrate with existing DOMContentLoaded path --
  document.addEventListener('DOMContentLoaded', function(){
    bootBg();
    applyLang();
    document.addEventListener('keydown', function(e){
      if (e.target && e.target.tagName === 'INPUT') return;
      if (e.key === 'b' || e.key === 'B') window.cycleBg();
      if (e.key === 'l' || e.key === 'L') window.toggleLang();
    });
  });
})();
</script>
<script>
/* ══ Relations (利回り×株価) + Task-2 layer rendering, v6.4 ══════════════════
   Renders docs/relations.json (balance), docs/macro_v2.json (decomposition/credit/
   funding/conditions) and docs/gamma.json (dealer gamma) into #rel-pane with a
   caption under EVERY figure. Never leaves a figure without an explanation; on
   error/unavailable shows "取得に失敗（最新値は表示しません）" (no silent blanks). */
(function(){
  "use strict";
  const REL={}, MAC={}, GAM={};        // caches
  let showNominal=false, loaded=false;
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?"":s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
  const nz=v=>(typeof v==="number"&&isFinite(v));
  const f=(v,d=2)=>nz(v)?I18.fmtNum(v,d):"—";
  const pct=(v,d=2)=>nz(v)?(v>=0?"+":"")+I18.fmtNum(v,d)+"%":"—";
  const BAD=()=>`<div class="rel-bad">${T("rel.bad")}</div>`;

  async function grab(url){
    try{ const r=await fetch(url+"?t="+Date.now(),{cache:"no-cache"});
      if(!r.ok) throw new Error(r.status); return {ok:true,data:await r.json()}; }
    catch(e){ console.warn("rel-fetch",url,e); return {ok:false,data:null}; }
  }

  // ── inline SVG helpers (no external lib) ──
  function poly(vals, W,H, pad, mn, mx, css, dash){
    const n=vals.length; if(n<2||mx===mn) return "";
    const X=i=>pad+ i/(n-1)*(W-2*pad);
    const Y=v=> H-pad-(v-mn)/(mx-mn)*(H-2*pad);
    const pts=vals.map((v,i)=> nz(v)?`${X(i).toFixed(1)},${Y(v).toFixed(1)}`:null).filter(Boolean).join(" ");
    if(!pts) return "";
    return `<polyline points="${pts}" style="fill:none;${css}"${dash?` stroke-dasharray="${dash}"`:""}/>`;
  }
  function minmax(a){ const v=a.filter(nz); return v.length?[Math.min(...v),Math.max(...v)]:[0,1]; }

  // dual-axis: equity (left, accent solid) + real/nominal (right)
  function dualChart(series, hasReal){
    if(!series||series.length<2) return "";
    const W=460,H=150;
    const eq=series.map(p=>p.equity), nom=series.map(p=>p.nominal), real=series.map(p=>p.real_yield);
    const [emn,emx]=minmax(eq);
    const ylist=hasReal?real.concat(showNominal?nom:[]):nom;
    const [ymn,ymx]=minmax(ylist.length?ylist:nom);
    let s=`<svg class="rel-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${T("rel.aria_dual")}">`;
    s+=poly(eq,W,H,6,emn,emx,"stroke:var(--accent);stroke-width:1.6");
    if(hasReal) s+=poly(real,W,H,6,ymn,ymx,"stroke:var(--yellow);stroke-width:1.4");
    else        s+=poly(nom,W,H,6,ymn,ymx,"stroke:var(--yellow);stroke-width:1.4");
    if(hasReal&&showNominal) s+=poly(nom,W,H,6,ymn,ymx,"stroke:var(--yellow);stroke-width:1;opacity:.6","3 2");
    return s+"</svg>";
  }
  // regime gauge: r in [-1,1] with history markers + zones
  function regimeGauge(r,hist){
    const W=460,H=64,pad=8, X=v=>pad+(v+1)/2*(W-2*pad);
    let s=`<svg class="rel-svg" style="height:64px" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${T("rel.aria_regime")}">`;
    // zones: <=-0.2 green(機能) / >=0.2 red(壊れる) / mid gray
    s+=`<rect x="${pad}" y="24" width="${X(-0.2)-pad}" height="12" style="fill:var(--green);opacity:.25"/>`;
    s+=`<rect x="${X(-0.2)}" y="24" width="${X(0.2)-X(-0.2)}" height="12" style="fill:var(--text-faint);opacity:.2"/>`;
    s+=`<rect x="${X(0.2)}" y="24" width="${W-pad-X(0.2)}" height="12" style="fill:var(--red);opacity:.25"/>`;
    s+=`<line x1="${X(0)}" y1="20" x2="${X(0)}" y2="40" style="stroke:var(--border2);stroke-width:1"/>`;
    const hm=[[T("rel.h_covid"),hist&&hist.covid_2020_03_2021_06,"var(--text-faint)"],
              ["2022",hist&&hist.inflation_2022,"var(--text-faint)"],
              [T("rel.h_1y"),hist&&hist.last_1y,"var(--text-dim)"]];
    hm.forEach(([lb,v])=>{ if(nz(v)){ s+=`<circle cx="${X(v).toFixed(1)}" cy="30" r="2.5" style="fill:var(--text-dim)"/>`+
        `<text x="${X(v).toFixed(1)}" y="18" style="fill:var(--text-faint);font-size:8px" text-anchor="middle">${lb}</text>`; }});
    if(nz(r)) s+=`<circle cx="${X(r).toFixed(1)}" cy="30" r="4" style="fill:var(--accent)"/>`+
        `<text x="${X(r).toFixed(1)}" y="52" style="fill:var(--accent);font-size:9px;font-weight:700" text-anchor="middle">${f(r,2)}</text>`;
    s+=`<text x="${pad}" y="52" style="fill:var(--green);font-size:8px">${T("rel.g_works")}</text>`;
    s+=`<text x="${W-pad}" y="52" style="fill:var(--red);font-size:8px" text-anchor="end">${T("rel.g_breaks")}</text>`;
    return s+"</svg>";
  }
  function betaBars(b){
    const rows=[["Nasdaq100",b&&b.nasdaq100],["Dow30",b&&b.dow30],["S&P500",b&&b.sp500]];
    const mx=Math.max(0.001,...rows.map(r=>Math.abs(nz(r[1])?r[1]:0)));
    return rows.map(([lb,v])=>{ const w=nz(v)?Math.abs(v)/mx*100:0;
      return `<div class="rel-bar-row"><span style="width:80px">${lb}</span>`+
        `<span class="rel-bar-track"><span class="rel-bar-fill" style="width:${w.toFixed(0)}%;left:0;background:${v<0?"var(--red)":"var(--green)"}"></span></span>`+
        `<span style="width:64px;text-align:right">${nz(v)?f(v,3)+"%":"—"}</span></div>`;
    }).join("");
  }
  const cap=html=>`<div class="rel-cap">${html}</div>`;

  // ── section renderers ──
  function renderBalance(){
    const R=REL.data;
    if(!R) return `<div class="rel-sec"><div class="rel-h">${T("rel.balance_h")}</div>${BAD()}</div>`;
    const b=R.balance, rg=b.regime, be=b.beta, rb=b.rebalance, cx=(b.context||{}).us_10y_nominal||{}, cxr=(b.context||{}).us_10y_real||{};
    const reg=R.regions||{};
    // upper: 3-region charts
    let charts="";
    [["us",true],["eu",false],["jp",false]].forEach(([k,hasReal])=>{
      const nm=T("region."+k);
      const rr=reg[k]||{}; const bad=rr.data_status!=="live"||!(rr.series&&rr.series.length);
      const last=(rr.series&&rr.series.length)?rr.series[rr.series.length-1]:null;
      charts+=`<div class="rel-col"><div class="rel-sub">${nm} <span class="rel-badge">${esc(I18.code("source",rr.source||""))}</span></div>`;
      if(bad){ charts+=BAD(); }
      else{
        charts+=dualChart(rr.series, hasReal);
        charts+=cap(T("rel.cap_region",{
          region:nm, lines:T(hasReal?"rel.lines_real":"rel.lines_nominal"),
          now:hasReal?T("rel.now_real",{eq:f(last&&last.equity,0),real:f(last&&last.real_yield,2),nom:f(last&&last.nominal,2)})
                     :T("rel.now_nominal",{eq:f(last&&last.equity,0),nom:f(last&&last.nominal,2)}),
          eqsrc:esc(I18.code("source",rr.equity_source||"")), src:esc(I18.code("source",rr.source||"")),
          limit:T(hasReal?"rel.limit_us":"rel.limit_eujp")}));
      }
      charts+=`</div>`;
    });
    const nomTgl=`<span class="rel-toggle" role="button" onclick="window.__relToggleNom&&window.__relToggleNom()">${T(showNominal?"rel.nom_hide":"rel.nom_show")}</span>`;
    // middle: regime
    const regBad=!nz(rg&&rg.r_120d);
    const h=(rg&&rg.history)||{};
    const mid=`<div class="rel-sub">${T("rel.regime_h")}</div>`+
      (regBad?BAD():regimeGauge(rg.r_120d,rg.history)+cap(T("rel.cap_regime",{
        r:f(rg.r_120d,2), label:esc(I18.code("regime",rg.label||"")),
        covid:f(h.covid_2020_03_2021_06,2), y2022:f(h.inflation_2022,2), y1:f(h.last_1y,2), n:I18.fmtNum(rg.n_obs,0)})));
    // lower: beta
    const mxdz=nz(cx.d20_z)?cx.d20_z:0;
    const low=`<div class="rel-sub">${T("rel.beta_h")}</div>`+
      (be&&(nz(be.nasdaq100)||nz(be.sp500))? betaBars(be)+cap(T("rel.cap_beta",{
        ndx:f(be.nasdaq100,3), dow:f(be.dow30,3), spx:f(be.sp500,3), days:I18.fmtNum(be.lookback_days,0)}))
      :BAD());
    // sidebar
    const side=`<div class="rel-side"><div class="rel-sub">${T("rel.side_h")}</div>`+
      `<div class="kv"><span>${T("rel.side_rebal")}</span><span>${rb&&rb.data_status==="live"?esc(I18.code("rebalance_pressure",rb.pressure)):"—"}</span></div>`+
      `<div class="kv"><span>${T("rel.side_ret")}</span><span>${rb?pct(rb.eq_ret_pct)+" / "+pct(rb.bond_ret_pct):"—"}</span></div>`+
      `<div class="kv"><span>${T("rel.side_gap")}</span><span>${rb?pct(rb.gap_pct):"—"}</span></div>`+
      `<div class="kv"><span>${T("rel.side_us10y")}</span><span>${f(cx.value,2)}%</span></div>`+
      `<div class="kv"><span>${T("rel.side_pctile")}</span><span>${nz(cx.pct_rank)?T("rel.pctile",{v:I18.fmtNum(cx.pct_rank,0)}):"—"}</span></div>`+
      `<div class="kv"><span>${T("rel.side_d20z")}</span><span class="${mxdz>=2?"rel-warn":""}">${f(cx.d20_z,2)}${mxdz>=2?" "+T("rel.fast"):""}</span></div>`+
      `<div class="rel-disc">${T("rel.side_disc")}</div></div>`;
    // ERP unavailable
    const erp=b.erp||{};
    const erpBox=`<div class="rel-sub">${T("rel.erp_h")}<span class="rel-badge">${T("rel.not_impl")}</span></div>`+
      `<div class="rel-bad">${T("rel.erp_body",{reason:esc(erp.reason?I18.code("erp_reason",erp.reason):T("rel.erp_reason_default"))})}</div>`;

    return `<div class="rel-sec"><div class="rel-h">${T("rel.balance_h3")} ${nomTgl}</div>`+
      `<div class="rel-flex">${charts}</div>${mid}`+
      `<div class="rel-flex"><div class="rel-col">${low}</div>${side}</div>${erpBox}`+
      `<div class="rel-disc">${T("common.disc_viz")}</div></div>`;
  }

  function ctxLine(id,S){ const s=(S&&S[id])||{}; const c=s.context||{};
    if(s.data_status!=="live") return `<div><b>${esc(id)}</b> <span class="k">${T("rel.ctx_failed")}</span></div>`;
    const warn=nz(c.d20_z)&&Math.abs(c.d20_z)>=2;
    return `<div><b>${esc(id)}</b> ${f(s.value,4)} <span class="k">[${esc(I18.code("macro_label",s.label||""))}]</span> `+
      `<span class="k">${T("rel.ctx_stats",{pct:nz(c.pct_rank)?I18.fmtNum(c.pct_rank,0):"—",z:f(c.z,2)})} <span class="${warn?"rel-warn":""}">${f(c.d20_z,2)}${warn?"⚠":""}</span></span></div>`;
  }
  function renderMacro(){
    const M=MAC.data;
    if(!M) return `<div class="rel-sec"><div class="rel-h">${T("rel.macro_h")}</div>${BAD()}</div>`;
    const S=M.series||{}, id=M.identities||{}, fi=id.fisher||{}, ex=id.expectations||{}, nl=M.net_liquidity||{};
    const byCat=c=>Object.keys(S).filter(k=>S[k].category===c);
    const grid=cats=>`<div class="rel-grid">${cats.map(k=>ctxLine(k,S)).join("")}</div>`;
    const decompCap=cap(T("rel.cap_decomp",{nom:f(fi.nominal,2),real:f(fi.real,2),be:f(fi.breakeven,2),gap:f(fi.gap,2),
      exnom:f(ex.nominal,2),tp:f(ex.term_premium,2),exp:f(ex.value,2)}));
    const nlCap=cap(T("rel.cap_netliq",{p:f(nl.primary&&nl.primary.value_tn,2),ref:f(nl.reference&&nl.reference.value_tn,2),
      rrp:f(nl.reference&&nl.reference.components_tn&&nl.reference.components_tn.RRP,4)}));
    return `<div class="rel-sec"><div class="rel-h">${T("rel.macro_h")}</div>`+
      `<div class="rel-sub">${T("rel.decomp_h")}</div>${grid(byCat("rates_decomp"))}${decompCap}`+
      `<div class="rel-sub">${T("rel.credit_h")}</div>${grid(byCat("credit"))}`+
      cap(T("rel.cap_credit",{hy:f((S.BAMLH0A0HYM2||{}).value,2),ig:f((S.BAMLC0A0CM||{}).value,2)}))+
      `<div class="rel-sub">${T("rel.funding_h")}</div>${grid(byCat("funding"))}${nlCap}`+
      `<div class="rel-sub">${T("rel.cond_h")}</div>${grid(byCat("conditions").concat(byCat("recession")))}`+
      cap(T("rel.cap_cond",{nfci:f((S.NFCI||{}).value,3),t10y3m:f((S.T10Y3M||{}).value,2),sahm:f((S.SAHMREALTIME||{}).value,2)}))+
      `<div class="rel-disc">${T("rel.macro_disc")} ${T("common.disc_viz")}</div></div>`;
  }

  function renderGamma(){
    const G=GAM.data;
    if(!G) return `<div class="rel-sec"><div class="rel-h">${T("rel.gamma_h")}</div>${BAD()}</div>`;
    const note=G.note?esc(I18.code("gamma_note",G.note)):"";
    if(G.data_status==="error") return `<div class="rel-sec"><div class="rel-h">${T("rel.gamma_h")}</div>${BAD()}<div class="rel-disc">${note}</div></div>`;
    const walls=(G.gamma_walls||[]).slice(0,10);
    const mxw=Math.max(0.001,...walls.map(w=>Math.abs(w.gex_bn||0)));
    const wallRows=walls.map(w=>{ const wd=Math.abs(w.gex_bn||0)/mxw*100;
      return `<div class="rel-bar-row"><span style="width:60px">${I18.fmtNum(w.strike,0)}</span>`+
        `<span class="rel-bar-track"><span class="rel-bar-fill" style="width:${wd.toFixed(0)}%;left:0;background:${(w.gex_bn||0)<0?"var(--red)":"var(--green)"}"></span></span>`+
        `<span style="width:70px;text-align:right">${T("rel.bn",{v:f(w.gex_bn,2)})}</span></div>`;}).join("");
    const vs=G.vol_structure||{};
    const zeroDte = G.gex_volume_0dte_status==="unavailable"
      ? `<div class="rel-bad">${T("rel.dte_unavail",{reason:esc(G.gex_volume_0dte_reason?I18.code("gamma_note",G.gex_volume_0dte_reason):"")})}</div>`
      : `<div class="rel-grid"><div><b>${T("rel.dte_vol")}</b> ${T("rel.bn",{v:f(G.gex_volume_0dte_bn,2)})}</div></div>`;
    const flip=esc(I18.code("flip_vs_spot",G.flip_vs_spot||""));
    const termState=esc(I18.code("term_state",vs.term_state||""));
    const cov=G.coverage||{};
    return `<div class="rel-sec"><div class="rel-h">${T("rel.gamma_h")}</div>`+
      `<div class="rel-grid"><div><b>${T("rel.gex_total")}</b> ${T("rel.bn_per1",{v:f(G.gex_oi_bn,2)})}</div><div><b>${T("rel.zero_gamma")}</b> ${f(G.zero_gamma,1)}</div>`+
      `<div><b>${T("rel.spot")}</b> ${f(G.spot,2)}</div><div><b>${T("rel.flip")}</b> ${flip}</div></div>`+
      cap(T("rel.cap_gamma",{gex:f(G.gex_oi_bn,2),zg:f(G.zero_gamma,1),spot:f(G.spot,2),
        zone:T(G.flip_vs_spot==="below_flip_amplifying"?"rel.zone_amp":"rel.zone_damp"),
        n:I18.fmtNum(G.n_contracts_oi,0), snap:esc(I18.code("source",(G.snapshot&&G.snapshot.source)||"")), note}))+
      `<div class="rel-sub">${T("rel.walls_h")}</div>${wallRows||BAD()}`+
      cap(T("rel.cap_walls",{strike:walls[0]?I18.fmtNum(walls[0].strike,0):"—",gex:walls[0]?T("rel.bn",{v:f(walls[0].gex_bn,2)}):"—"}))+
      `<div class="rel-sub">${T("rel.dte_h")}</div>${zeroDte}`+
      cap(T("rel.cap_dte",{n:I18.fmtNum(G.n_0dte_contracts,0)}))+
      `<div class="rel-sub">${T("rel.volstruct_h")}</div><div class="rel-grid">`+
      `<div><b>VIX3M/VIX</b> ${f(vs.vix3m_vix_ratio,3)} <span class="k">[${termState}]</span></div>`+
      `<div><b>SKEW</b> ${f(vs.skew,1)}</div><div><b>MOVE/VIX</b> ${f(vs.move_vix_ratio,3)}</div></div>`+
      cap(T("rel.cap_volstruct",{ratio:f(vs.vix3m_vix_ratio,3),state:termState,skew:f(vs.skew,1),mv:f(vs.move_vix_ratio,3)}))+
      `<div class="rel-bad">${T("rel.assumption",{a:esc(I18.code("gamma_assumption",G.assumption||"")),note})}</div>`+
      `<div class="rel-disc">${T("rel.coverage",{us:esc(I18.code("coverage",cov.us)),eu:esc(I18.code("coverage",cov.eu)),jp:esc(I18.code("coverage",cov.jp))})} ${T("common.disc_viz")}</div></div>`;
  }

  function render(){
    const el=$("rel-pane"); if(!el) return;
    el.innerHTML=`<div class="mf-disc">⚠ ${T("common.disc_env")}</div>`+
      renderBalance()+renderMacro()+renderGamma();
  }
  async function load(force){
    if(loaded&&!force) return;
    const [a,b,c]=await Promise.all([grab("relations.json"),grab("macro_v2.json"),grab("gamma.json")]);
    REL.data=a.ok?a.data:null; MAC.data=b.ok?b.data:null; GAM.data=c.ok?c.data:null;
    loaded=true; render();
  }
  window.__relToggleNom=function(){ showNominal=!showNominal; render(); };
  I18.onChange(()=>{ if(loaded) render(); });
  window.__relShow=function(){
    $("rel-pane").style.display="block";
    const tw=document.querySelector(".tbl-wrap"); if(tw) tw.style.display="none";
    const tb=$("toolbar"); if(tb) tb.style.display="none";
    load(false);
  };
  window.__relHide=function(){
    const p=$("rel-pane"); if(p) p.style.display="none";
    const tw=document.querySelector(".tbl-wrap"); if(tw) tw.style.display="";
    const tb=$("toolbar"); if(tb) tb.style.display="";
  };
})();
</script>
</body>
</html>
