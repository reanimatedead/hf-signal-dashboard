[project]
name = "screener"
version = "0.1.0"
description = "公開ダッシュボード（GitHub Pages）の計算式と、Mac mini でだけ動く日本株・米国株のスクリーニング"
readme = "README.md"
requires-python = ">=3.11"
# requirements.txt（公開ダッシュボードの生成・deploy.yml）と同じ下限 + src/screener が使うもの（numpy）
dependencies = [
    "yfinance>=0.2.36",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "lxml>=4.9.0",
    "html5lib>=1.1",
    "scipy>=1.11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8",
    "pre-commit>=3.7",
    "shellcheck-py>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screener"]

[tool.pytest.ini_options]
# uv 無しの python3 -m pytest tests/ でも src/screener を import できるように
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "needs_data_json: 生成物（docs/data.json など）が必要。無ければ skip、REQUIRE_DATA_JSON=1 なら fail（tests/_data_json_gate.py）",
]

# ── ruff: src/screener と tests/screener だけ（既存のトップレベルのファイルは整形・検査しない）──
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
include = ["src/**/*.py", "tests/screener/**/*.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# l（安値）は式の慣習の名前。E741 は止める
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]

# ── mypy: src/screener だけ ──
[tool.mypy]
python_version = "3.11"
files = ["src/screener"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true
