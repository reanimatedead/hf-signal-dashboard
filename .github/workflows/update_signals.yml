# DEPRECATED 2026-07-26: deploy.yml の full / corr_refresh ジョブに統合済み。
# 2026-11: commit/push ステップを削除（data.json を誰もコミットしない）。手動の生成確認用。
# deploy.yml が1週間安定稼働したら削除予定。
name: Daily Signal Update (00:00 JST)

on:
  # schedule は deploy.yml の full に移譲済み（重複のため停止）。手動のみ残す。
  workflow_dispatch:   # Allow manual trigger from GitHub UI

permissions:
  contents: read       # 2026-11: 何もコミットしない（data.json は git に積まない）

jobs:
  update-signals:
    name: Fetch & Generate Signals
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Python setup ────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Run signal generation (incl. v4.1 money_flow) ─
      - name: Generate signals
        run: python fetch_signals.py

      # ── 4a'. Re-merge correlations (preserve corr block) ──
      # fetch_signals.py は data.json を全再構築するため correlations を
      # 再マージする(fetch_signals.py は編集禁止のため後段で注入)。
      - name: Re-merge correlations (preserve corr block)
        run: python3 pipeline/build_corr.py

      # ── 4a. Schema gate (fail-fast on contract regression) ─
      - name: Verify contracts (pytest)
        run: |
          pip install pytest
          pytest tests/test_money_flow_schema.py \
                 tests/test_index_html_contract.py \
                 tests/test_survival_loop_schema.py \
                 tests/test_risk_ceiling.py \
                 tests/test_pattern_table_invariants.py \
                 tests/test_bankruptcy_simulator.py \
                 -q

      # ── 4b. Generate (legacy) macro layer (still wired) ──
      - name: Generate macro layer
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python pipeline/build_macro.py

      # ── 5/6. (removed 2026-11) commit/push of docs/data.json ──
      # 生成物は git に積まない（DATA_CONTRACT §11）。配信は deploy.yml の actions/deploy-pages だけ。
      # このワークフローは手動の生成確認用としてだけ残す（何もコミットしない）。
