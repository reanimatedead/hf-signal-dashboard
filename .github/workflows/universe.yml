name: Weekly universe + US fundamentals

# 毎週月曜 2:00 JST（= 日曜 17:00 UTC）:
#   1. tools/update_universe.py — 構成銘柄（S&P500 / Nasdaq-100 / Dow30）を取り直し、件数 ±5% を検査。
#      外れたら前週の一覧のまま（Issue をタイトル固定で1件だけ）。差分は data/universe/changes.json。
#      日経225 は DATA_CONTRACT §19 に従い既定では取得しない（リポジトリ変数 NIKKEI_DYNAMIC=true のときだけ）。
#   2. tools/build_us_fundamentals.py — EDGAR を1社ずつ → data/us_fundamentals.json（最初に主要20社のタグ契約テスト）。
#      失敗したら前回のファイルのまま（Issue 1件）。
#   3. 変更をコミット（tools/git_push_retry.sh）。
# SEC は User-Agent に連絡先を求めるので、リポジトリ変数 SEC_USER_AGENT を設定すること。

on:
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: universe
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install (lock)
        run: pip install -r requirements.lock

      - name: Update universe (±5% check, keep previous week on failure)
        id: uni
        env:
          NIKKEI_DYNAMIC: ${{ vars.NIKKEI_DYNAMIC }}
        run: python3 tools/update_universe.py --issue-body /tmp/universe_issue.md

      - name: Issue (once) if a universe was kept
        if: steps.uni.outputs.bad != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "" >> /tmp/universe_issue.md
          echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> /tmp/universe_issue.md
          python3 tools/issue_once.py --title "🟠 universe.yml: 構成銘柄の件数が想定外（前週の一覧のまま）" --body-file /tmp/universe_issue.md

      - name: Build US fundamentals (EDGAR, one company at a time)
        id: fund
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python3 tools/build_us_fundamentals.py

      - name: Issue (once) if US fundamentals failed
        if: steps.fund.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/issue_once.py --title "🟠 universe.yml: 米国決算（EDGAR）の更新が失敗（前回のまま）" \
            --body "build_us_fundamentals が止まりました（契約テスト or 取得率不足）。data/us_fundamentals.json は前回のままです。run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Offline tests for the changed files
        run: python -m pytest tests/test_universe_lists.py tests/test_update_universe.py tests/test_us_fundamentals.py marketcalc/tests -q

      - name: Commit universe + fundamentals
        run: |
          tools/git_push_retry.sh "chore(universe): weekly $(date -u '+%Y-%m-%d')" data/universe data/us_fundamentals.json

      - name: Open issue on failure (universe)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/issue_once.py --title "🔴 universe.yml: 週次更新ジョブが失敗" \
            --body "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
