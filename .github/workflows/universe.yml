name: Weekly universe + US fundamentals

# 毎週月曜 2:00 JST（= 日曜 17:00 UTC）:
#   1. tools/update_universe.py — 構成銘柄（S&P500 / Nasdaq-100 / Dow30）を取り直し、件数 ±5% を検査。
#      外れたら前週の一覧のまま。差分は data/universe/changes.json。
#      日経225 は DATA_CONTRACT §19 に従い既定では取得しない（リポジトリ変数 NIKKEI_DYNAMIC=true のときだけ）。
#   2. tools/build_us_fundamentals.py — EDGAR を1社ずつ → data/us_fundamentals.json（最初に主要20社のタグ契約テスト）。
#      失敗したら前回のファイルのまま。
#   3. 変更をコミット（tools/git_push_retry.sh）。
# SEC は User-Agent に連絡先を求めるので、リポジトリ変数 SEC_USER_AGENT を設定すること。

on:
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universe
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv (Python 3.11)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install (uv.lock)
        run: uv sync --locked

      - name: Update universe (±5% check, keep previous week on failure)
        id: uni
        env:
          NIKKEI_DYNAMIC: ${{ vars.NIKKEI_DYNAMIC }}
        run: uv run python tools/update_universe.py

      - name: Build US fundamentals (EDGAR, one company at a time)
        id: fund
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: uv run python tools/build_us_fundamentals.py

      - name: Offline tests for the changed files
        run: uv run pytest tests/test_universe_lists.py tests/test_update_universe.py tests/test_us_fundamentals.py tests/screener/calc -q

      - name: Commit universe + fundamentals
        run: |
          tools/git_push_retry.sh "chore(universe): weekly $(date -u '+%Y-%m-%d')" data/universe data/us_fundamentals.json

      # 失敗の通知は ntfy だけ（Issue は作らない）。本文は「ジョブ名・日付・失敗」だけ。
      # リポジトリの Secret NTFY_TOPIC が無ければ ::warning:: をログに出す（通知は送れない）。
      - name: Notify ntfy on failure (universe)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] || { echo "::warning::NTFY_TOPIC が未設定のため、失敗の通知を送れませんでした（Settings → Secrets → Actions に NTFY_TOPIC を登録）"; exit 0; }
          curl -fsS -m 20 -d "hf-signal-dashboard universe $(TZ=Asia/Tokyo date +%F) 失敗" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || echo "ntfy 送信失敗"
