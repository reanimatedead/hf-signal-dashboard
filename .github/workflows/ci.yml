name: CI

# データもキーも不要（架空データだけ）。uv.lock の版で ruff / mypy / pytest。
# 生成物（docs/data.json など）が要るテストは自動で skip される（tests/_data_json_gate.py）。
# それらは deploy.yml full の「Data tests」ステップで生成後にスキップ禁止で回る。
# 旧 marketcalc.yml（計算式のテスト）はここに統合した（tests/screener/calc）。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: uv sync (uv.lock)
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check src tests/screener

      - name: ruff format --check
        run: uv run ruff format --check src tests/screener

      - name: mypy
        run: uv run mypy src/screener

      - name: pytest
        run: uv run pytest -q

      # 2026-11: deploy.yml の full は requirements.lock（pip・Python 3.11）で pytest を回す。uv.lock とは入る物が違う
      # （deploy #265 は uv.lock にだけある pyyaml を import したテストで失敗した）。同じ環境でも一度回して先に気づく。
      - name: Set up Python 3.11 (deploy と同じ)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pytest (requirements.lock = deploy と同じ環境)
        run: |
          python -m venv /tmp/lockenv
          /tmp/lockenv/bin/pip install -q -r requirements.lock pytest
          /tmp/lockenv/bin/python -m pytest tests/ -q
