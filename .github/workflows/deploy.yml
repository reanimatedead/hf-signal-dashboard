name: Deploy to Pages (full daily + corr refresh)

# A-Ⅰ: builds the site and deploys it via the GitHub Pages *Actions* source
# (actions/deploy-pages). Data is generated in-job and uploaded as the Pages
# artifact — it is NOT committed to git (that switch is A-Ⅱ). If generation, the
# health gate, or the contract tests fail, the artifact is never uploaded and the
# job fails, so deploy-pages keeps the previous good deploy live. This is the
# "never overwrite with broken data" mechanism.
#
# Two jobs share one Pages deployment (concurrency group "pages", no cancel):
#   full         — 00:00 JST daily: full regeneration + macro + deploy
#   corr_refresh — 07:30 / 11:00 JST Mon-Fri: pull the live site as base,
#                  recompute correlations only, redeploy the full payload
# On manual dispatch, pick which job via the `job` input (default: full).

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run on manual dispatch"
        type: choice
        options: [full, corr_refresh]
        default: full
  schedule:
    - cron: "0 15 * * *"      # full         — 00:00 JST daily
    - cron: "30 22 * * 0-4"   # corr_refresh — 07:30 JST Mon-Fri
    - cron: "0 2 * * 1-5"     # corr_refresh — 11:00 JST Mon-Fri

permissions:
  contents: read
  pages: write
  id-token: write
  # 2026-11: 失敗時の Issue 自動起票はやめた（通知は ntfy だけ）。Issue の書き込み権限は外した。

# One live Pages deployment at a time.
# 2026-08-19 変更: cancel-in-progress を false → true に反転。
# 経緯: 2026-08-11 16:00Z の full run が GitHub 側都合で 8 日間 queued の
# まま滞留し、以後の全 scheduled run が同 concurrency group で cancelled
# 扱いになり、data.json が 213h 古いまま配信され続けた（Issue #4）。
# false は "in-flight を殺さない" 意図だったが、queued 詰まりが起きた瞬間
# 復旧が全て人手ゲート待ちになる。true にすることで次の schedule が詰まった
# 前段を強制上書きしてパイプラインが自己回復する。deploy は数分で終わり、
# schedule 間隔(最短でも 3.5h)より十分短いため正常運用中の意図せぬ cancel は
# 起きない。
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ── FULL: 00:00 JST daily (or manual `job=full`) ──────────────────────────
  full:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.job == 'full') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 15 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin Pages to the Actions build on EVERY deploy: a push to main must never
      # trigger GitHub's automatic branch build (pages-build-deployment), which
      # serves only the git tree — the gitignored data.json / charts / layer files
      # are absent there → 404. Root fix for the 2026-07-27 outage where a
      # collect.yml push flipped delivery to a branch build and clobbered the
      # artifact deploy. configure-pages re-asserts build_type=workflow each run.
      - name: Configure Pages (pin build_type=workflow)
        uses: actions/configure-pages@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      # 2026-11: 版を固定した requirements.lock を使う（requirements.txt は下限指定として残す）。
      # 自動では上げない。
      - name: Install dependencies (requirements.lock)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      # 2026-11 (M2): 事前の確認は構成銘柄件数 ±5% だけ（外れたら止める）。Yahoo には問い合わせない
      # （本体の取得と同じ IP の回数制限枠を使ってしまうため）。欠損は生成後の nan_report（"Missing-data check"）で見る。
      - name: Contract check (external data)
        run: python3 tools/contract_check.py

      # Generate → correlations → macro. build_macro is full-only (index.html does
      # not read docs/data/macro.json, but external consumers may; 3s / 13 FRED
      # calls buys removing that unknown risk). corr_refresh does NOT run it.
      - name: Generate signals
        run: python3 fetch_signals.py

      - name: Re-merge correlations
        run: python3 pipeline/build_corr.py

      - name: Generate macro layer (legacy docs/data/macro.json)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 pipeline/build_macro.py

      # v2 macro layer (docs/macro_v2.json) — FRED 16-series decomposition/credit/
      # funding + percentile context. Distinct from the legacy docs/data/macro.json.
      - name: Generate macro_v2 layer
        run: python3 pipeline/build_macro_v2.py

      # Dealer gamma layer (docs/gamma.json) — CBOE public SPX chain; live API in
      # CI (no ~/taka-data archive). Reads docs/data.json for MOVE/VIX, so it runs
      # after fetch_signals.
      - name: Generate gamma layer
        run: python3 pipeline/build_gamma.py

      # Yield×equity balance layer (docs/relations.json) — US/JP equities from FRED,
      # EU equity from yfinance (no FRED STOXX50E). Real-yield-based (US).
      - name: Generate relations layer
        run: python3 pipeline/build_relations.py

      # Fail-closed gates: any failure below stops the job BEFORE upload, so the
      # previous good Pages deploy stays live.
      - name: Health gate
        run: python3 tools/health_gate.py

      # 2026-08-19 追加: 生成直後の freshness<48h & completeness>=90% 二条件
      # ハード assert。しきい値は tools/gate_thresholds.py。probe(verify_live)
      # は外形監視で 2h 遅延あり、生成ジョブ内で自壊させる方が発覚が早い。
      - name: Assert generated payload health (freshness + completeness)
        run: PYTHONPATH=tools python3 tools/assert_gen_health.py

      # 生成後の欠損チェック: data.json の meta.nan_report で、株式4タブの price=None が 10% 超なら止める。
      - name: Missing-data check (nan_report)
        run: python3 tools/contract_check.py --post docs/data.json

      # 生成物（docs/data.json など）が必要なテスト（marker needs_data_json）。オフライン（ci.yml）では
      # skip されるので、生成済みのここでスキップ禁止で回す。欠けていれば失敗 → upload/deploy は走らず前日のまま。
      - name: Data tests (data.json 必須・スキップ禁止)
        run: REQUIRE_DATA_JSON=1 python3 -m pytest tests/ -q -m needs_data_json

      - name: Contract tests
        run: python3 -m pytest tests/ -q

      # Link liveness (Task 5-4) — 警告のみ。Yahoo 429 等の誤検知で job を落とさない
      # ため、常に成功扱い（|| true は不要：スクリプト自身が exit 0 を返す）。
      - name: Check links (warn only)
        run: python3 tools/check_links.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5

      # 2026-11: 公開後の訳し漏れ確認。生成した本物の data.json で全タブ×ja/en（＋銘柄詳細）を開き、
      # 見えている文字に snake_case（辞書を通っていないコード）が残っていたら ::warning:: を出す。
      # 公開は止めない（公開の後に走り、continue-on-error で失敗しても job を落とさない）。
      - name: Set up Node (post-deploy i18n check)
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Post-deploy i18n check (snake_case on real data, warn only)
        continue-on-error: true
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          python3 -m http.server -d docs 8770 >/dev/null 2>&1 &
          sleep 2
          node tools/preview_screens.mjs http://127.0.0.1:8770 _postdeploy_screens --warn-only

      # 失敗の通知は ntfy だけ（Issue は作らない）。本文は「ジョブ名・日付・失敗」だけ。
      # リポジトリの Secret NTFY_TOPIC が無ければ ::warning:: をログに出す（通知は送れない）。
      - name: Notify ntfy on failure (deploy-full)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] || { echo "::warning::NTFY_TOPIC が未設定のため、失敗の通知を送れませんでした（Settings → Secrets → Actions に NTFY_TOPIC を登録）"; exit 0; }
          curl -fsS -m 20 -d "hf-signal-dashboard deploy-full $(TZ=Asia/Tokyo date +%F) 失敗" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || echo "ntfy 送信失敗"

  # ── CORR_REFRESH: 07:30 / 11:00 JST Mon-Fri (or manual `job=corr_refresh`) ─
  corr_refresh:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.job == 'corr_refresh') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 22 * * 0-4') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 1-5')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PAGES_BASE: "https://reanimatedead.github.io/hf-signal-dashboard"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin Pages to the Actions build on EVERY deploy: a push to main must never
      # trigger GitHub's automatic branch build (pages-build-deployment), which
      # serves only the git tree — the gitignored data.json / charts / layer files
      # are absent there → 404. Root fix for the 2026-07-27 outage where a
      # collect.yml push flipped delivery to a branch build and clobbered the
      # artifact deploy. configure-pages re-asserts build_type=workflow each run.
      - name: Configure Pages (pin build_type=workflow)
        uses: actions/configure-pages@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Pull docs/data.json + required charts/*.json from the live site (chart
      # tabs derived from data.json), then guard the base (fail closed): stale
      # (>48h), missing keys, missing chart_status, or equity ready < 90% → exit 1.
      - name: Pull live site as deploy base + guard
        run: python3 tools/pull_live_base.py

      - name: Re-merge correlations
        run: python3 pipeline/build_corr.py

      - name: Health gate
        run: python3 tools/health_gate.py

      # 2026-08-19 追加: corr_refresh も生成後 assert（freshness は pull_live_base
      # が持ってきた base の updated_at が 48h 以内である事を再確認する意味）。
      - name: Assert generated payload health (freshness + completeness)
        run: PYTHONPATH=tools python3 tools/assert_gen_health.py

      - name: Contract tests
        run: python3 -m pytest tests/ -q

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5

      # 失敗の通知は ntfy だけ（Issue は作らない）。本文は「ジョブ名・日付・失敗」だけ。
      # リポジトリの Secret NTFY_TOPIC が無ければ ::warning:: をログに出す（通知は送れない）。
      - name: Notify ntfy on failure (deploy-corr_refresh)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] || { echo "::warning::NTFY_TOPIC が未設定のため、失敗の通知を送れませんでした（Settings → Secrets → Actions に NTFY_TOPIC を登録）"; exit 0; }
          curl -fsS -m 20 -d "hf-signal-dashboard deploy-corr_refresh $(TZ=Asia/Tokyo date +%F) 失敗" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || echo "ntfy 送信失敗"
