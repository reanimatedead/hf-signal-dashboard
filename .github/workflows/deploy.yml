name: Deploy to Pages (full daily + corr refresh)

# A-Ⅰ: builds the site and deploys it via the GitHub Pages *Actions* source
# (actions/deploy-pages). Data is generated in-job and uploaded as the Pages
# artifact — it is NOT committed to git (that switch is A-Ⅱ). If generation, the
# health gate, or the contract tests fail, the artifact is never uploaded and the
# job fails, so deploy-pages keeps the previous good deploy live. This is the
# "never overwrite with broken data" mechanism.
#
# Two jobs share one Pages deployment (concurrency group "pages", no cancel):
#   full         — 00:00 JST daily: full regeneration + macro + deploy
#   corr_refresh — 07:30 / 11:00 JST Mon-Fri: pull the live site as base,
#                  recompute correlations only, redeploy the full payload
# On manual dispatch, pick which job via the `job` input (default: full).

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run on manual dispatch"
        type: choice
        options: [full, corr_refresh]
        default: full
  schedule:
    - cron: "0 15 * * *"      # full         — 00:00 JST daily
    - cron: "30 22 * * 0-4"   # corr_refresh — 07:30 JST Mon-Fri
    - cron: "0 2 * * 1-5"     # corr_refresh — 11:00 JST Mon-Fri

permissions:
  contents: read
  pages: write
  id-token: write

# One live Pages deployment at a time; never cancel an in-flight deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── FULL: 00:00 JST daily (or manual `job=full`) ──────────────────────────
  full:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.job == 'full') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 15 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin Pages to the Actions build on EVERY deploy: a push to main must never
      # trigger GitHub's automatic branch build (pages-build-deployment), which
      # serves only the git tree — the gitignored data.json / charts / layer files
      # are absent there → 404. Root fix for the 2026-07-27 outage where a
      # collect.yml push flipped delivery to a branch build and clobbered the
      # artifact deploy. configure-pages re-asserts build_type=workflow each run.
      - name: Configure Pages (pin build_type=workflow)
        uses: actions/configure-pages@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Generate → correlations → macro. build_macro is full-only (index.html does
      # not read docs/data/macro.json, but external consumers may; 3s / 13 FRED
      # calls buys removing that unknown risk). corr_refresh does NOT run it.
      - name: Generate signals
        run: python3 fetch_signals.py

      - name: Re-merge correlations
        run: python3 pipeline/build_corr.py

      - name: Generate macro layer (legacy docs/data/macro.json)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 pipeline/build_macro.py

      # v2 macro layer (docs/macro_v2.json) — FRED 16-series decomposition/credit/
      # funding + percentile context. Distinct from the legacy docs/data/macro.json.
      - name: Generate macro_v2 layer
        run: python3 pipeline/build_macro_v2.py

      # Dealer gamma layer (docs/gamma.json) — CBOE public SPX chain; live API in
      # CI (no ~/taka-data archive). Reads docs/data.json for MOVE/VIX, so it runs
      # after fetch_signals.
      - name: Generate gamma layer
        run: python3 pipeline/build_gamma.py

      # Yield×equity balance layer (docs/relations.json) — US/JP equities from FRED,
      # EU equity from yfinance (no FRED STOXX50E). Real-yield-based (US).
      - name: Generate relations layer
        run: python3 pipeline/build_relations.py

      # Fail-closed gates: any failure below stops the job BEFORE upload, so the
      # previous good Pages deploy stays live.
      - name: Health gate
        run: python3 tools/health_gate.py

      - name: Contract tests
        run: python3 -m pytest tests/ -q

      # Link liveness (Task 5-4) — 警告のみ。Yahoo 429 等の誤検知で job を落とさない
      # ため、常に成功扱い（|| true は不要：スクリプト自身が exit 0 を返す）。
      - name: Check links (warn only)
        run: python3 tools/check_links.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5

  # ── CORR_REFRESH: 07:30 / 11:00 JST Mon-Fri (or manual `job=corr_refresh`) ─
  corr_refresh:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.job == 'corr_refresh') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 22 * * 0-4') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * 1-5')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PAGES_BASE: "https://reanimatedead.github.io/hf-signal-dashboard"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin Pages to the Actions build on EVERY deploy: a push to main must never
      # trigger GitHub's automatic branch build (pages-build-deployment), which
      # serves only the git tree — the gitignored data.json / charts / layer files
      # are absent there → 404. Root fix for the 2026-07-27 outage where a
      # collect.yml push flipped delivery to a branch build and clobbered the
      # artifact deploy. configure-pages re-asserts build_type=workflow each run.
      - name: Configure Pages (pin build_type=workflow)
        uses: actions/configure-pages@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Pull docs/data.json + required charts/*.json from the live site (chart
      # tabs derived from data.json), then guard the base (fail closed): stale
      # (>48h), missing keys, missing chart_status, or equity ready < 90% → exit 1.
      - name: Pull live site as deploy base + guard
        run: python3 tools/pull_live_base.py

      - name: Re-merge correlations
        run: python3 pipeline/build_corr.py

      - name: Health gate
        run: python3 tools/health_gate.py

      - name: Contract tests
        run: python3 -m pytest tests/ -q

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5
